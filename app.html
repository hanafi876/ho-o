<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Fantasy Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- User Profile Header -->
  <div id="userProfile" class="user-profile">
    <img id="userAvatar" src="" alt="User" class="user-avatar">
    <span id="userName"></span>
    <button id="logoutBtn" class="logout-btn">❌</button>
  </div>

  <!-- Main Story Container -->
  <div id="storyContainer" class="story-container">
    <!-- Scene akan dirender di sini -->
    <div class="scene-background" id="sceneBg"></div>
    
    <div class="scene-content">
      <div class="character-container">
        <img id="characterImg" src="" alt="Character" class="character-img">
        <div id="characterName" class="character-name"></div>
      </div>
      
      <div id="dialogueBox" class="dialogue-box">
        <div id="dialogueText" class="dialogue-text"></div>
      </div>
      
      <div id="choicesContainer" class="choices-container"></div>
    </div>
  </div>

  <!-- GSAP CDN untuk smooth transitions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- Firebase Auth -->
  <script type="module">
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    window.auth = getAuth();
  </script>
  
  <!-- App Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/story-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
