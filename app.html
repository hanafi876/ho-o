<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Fantasy Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-spinner"></div>
    <p>Loading petualangan...</p>
  </div>

  <!-- User Profile -->
  <div id="userProfile" class="user-profile hidden">
    <img id="userAvatar" src="" alt="User" class="user-avatar">
    <span id="userName"></span>
    <button id="logoutBtn" class="logout-btn">❌</button>
  </div>

  <!-- Story -->
  <div id="storyContainer" class="story-container hidden">
    <div class="scene-background" id="sceneBg"></div>
    <div class="scene-content">
      <div class="character-container">
        <img id="characterImg" src="" alt="Character" class="character-img">
        <div id="characterName" class="character-name"></div>
      </div>
      <div id="dialogueBox" class="dialogue-box">
        <div id="dialogueText" class="dialogue-text"></div>
      </div>
      <div id="choicesContainer" class="choices-container"></div>
    </div>
  </div>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- Scripts -->
  <script type="module" src="js/auth-app.js"></script>
  <script src="js/story-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
