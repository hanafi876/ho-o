<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Fantasy Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">🗡️ Dark Fantasy Quest</h1>
      <p class="login-subtitle">Masuk ke dunia petualangan epik...</p>
      <button id="googleLoginBtn" class="login-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-icon">
        Login dengan Google
      </button>
      <div id="loginStatus" class="login-status hidden"></div>
    </div>
  </div>

  <!-- 🔥 FIREBASE v12.11.0 + AUTH - SIAP PAKAI CONFIG ANDA! -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    // ✅ CONFIG ANDA - SUDAH LENGKAP!
    const firebaseConfig = {
      apiKey: "AIzaSyCOlYwSjMJRsRwru9Ui6ArBJp0NePSNu7g",
      authDomain: "ho-o-2a7cd.firebaseapp.com",
      projectId: "ho-o-2a7cd",
      storageBucket: "ho-o-2a7cd.firebasestorage.app",
      messagingSenderId: "1057456094946",
      appId: "1:1057456094946:web:eb3e82d917a1f2489728bb",
      measurementId: "G-Q3Y8F63XEK"
    };

    // Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // UI Elements
    const loginBtn = document.getElementById('googleLoginBtn');
    const status = document.getElementById('loginStatus');

    // Auto redirect jika sudah login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'app.html';
      }
    });

    // Login handler
    loginBtn.addEventListener('click', async () => {
      try {
        status.textContent = '🔄 Sedang login...';
        status.classList.remove('hidden');
        
        const result = await signInWithPopup(auth, provider);
        console.log('✅ Login sukses:', result.user.displayName);
        window.location.href = 'app.html';
      } catch (error) {
        console.error('❌ Error:', error);
        status.textContent = '❌ Gagal login: ' + error.message;
      }
    });
  </script>
</body>
</html>
